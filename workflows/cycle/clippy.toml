# clippy.toml, next to Cargo.toml. Settings only; lint levels live in
# Cargo.toml [lints] (see Cargo.toml.snippet).

# The pub surface is frozen after step 4 (QA.md: pub diff empty).
# Clippy must not suggest changes to exported items.
avoid-breaking-exported-api = true

# Contract style: few arguments, small functions.
too-many-arguments-threshold = 5
cognitive-complexity-threshold = 15

# Tests may unwrap, expect and print. Production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
